<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Bait traffic into chain-reaction crashes and hop to safety in Crossing Carnage, a pixel-art highway game.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%2316181D'/><text x='32' y='44' font-family='Georgia,serif' font-size='36' fill='%23FCFBF8' text-anchor='middle'>D</text></svg>">
  <title>Crossing Carnage &middot; David Clough</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #FCFBF8;
      --surface: #FFFFFF;
      --ink: #16181D;
      --muted: #6B7280;
      --line: rgba(22,24,29,0.10);
      --accent: #B4451F;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14161A;
        --surface: #1C1F24;
        --ink: #EDEDEF;
        --muted: #9AA1AC;
        --line: rgba(237,237,239,0.14);
        --accent: #E07A4F;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    .wrap { max-width: 1040px; margin: 0 auto; padding: 24px; }
    .top { display: flex; flex-direction: column; align-items: flex-start; gap: 24px; }
    .back { color: var(--muted); text-decoration: none; }
    .back:hover { color: var(--accent); }
    h1 { margin: 0; font: 400 40px/1.1 Georgia, 'Iowan Old Style', 'Times New Roman', serif; }
    .hint { margin: 16px 0 24px; color: var(--muted); font-size: 14px; }
    .stage { overflow: hidden; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
    canvas { display: block; width: 100%; max-width: 100%; aspect-ratio: 4 / 3; margin: auto; touch-action: none; image-rendering: pixelated; }
    canvas:focus-visible { outline-offset: -4px; }
    .hud { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; margin-top: 16px; }
    .stats { display: flex; gap: 24px; min-width: 0; }
    .stat { color: var(--muted); font-size: 12px; min-width: 0; }
    .stat output { display: block; color: var(--ink); font-size: 20px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    .actions { display: flex; gap: 8px; }
    button { min-height: 44px; padding: 8px 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; cursor: pointer; }
    button:hover:not(:disabled) { border-color: var(--accent); }
    button:disabled { color: var(--muted); cursor: default; opacity: 0.6; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
    @media (max-width: 480px) {
      .stats { width: 100%; justify-content: space-between; gap: 8px; }
      .actions { width: 100%; }
      button { flex: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>

    <div class="hud">
      <div class="stats" aria-label="Game statistics">
        <div class="stat">Score<output id="score">0</output></div>
        <div class="stat">High<output id="best">0</output></div>
        <div class="stat">Lives<output id="lives">3</output></div>
        <div class="stat">Level<output id="level">1</output></div>
      </div>
      <div class="actions"><button id="pause" type="button" disabled>Pause</button><button id="restart" type="button">New game</button></div>
    </div>
    <span class="sr-only" role="status" aria-live="polite" id="announcement"></span>

      function update(dt) {

      }
      function box(x, y, w, h, color) { g.fillStyle = palette[color]; g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }

      function centered(value, y, color = '4', size = 1) { text(value, (W - (value.length * 6 - 1) * size) / 2, y, color, size); }

      background.width = W; background.height = H;
      function buildScenery() {

      window.addEventListener('blur', suspend);
      canvas.addEventListener('blur', () => { queued = null; });
      window.addEventListener('resize', resize);
