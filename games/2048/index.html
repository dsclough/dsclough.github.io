<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Play 2048. Slide and combine matching tiles, build your score, and keep going beyond 2048.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%2316181D'/><text x='32' y='44' font-family='Georgia,serif' font-size='36' fill='%23FCFBF8' text-anchor='middle'>D</text></svg>">
  <title>2048 &middot; David Clough</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #FCFBF8;
      --surface: #FFFFFF;
      --ink: #16181D;
      --muted: #6B7280;
      --line: rgba(22,24,29,0.10);
      --accent: #B4451F;
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14161A;
        --surface: #1C1F24;
        --ink: #EDEDEF;
        --muted: #9AA1AC;
        --line: rgba(237,237,239,0.14);
        --accent: #E07A4F;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    .wrap { max-width: 820px; margin: 0 auto; padding: 24px; }
    .top { display: flex; flex-direction: column; align-items: flex-start; gap: 24px; }
    .back { color: var(--muted); font-size: 14px; text-decoration: none; }
    .back:hover { color: var(--accent); }
    h1 { margin: 0; font: 400 40px/1.1 Georgia, 'Iowan Old Style', 'Times New Roman', serif; }
    .hint { margin: 0 0 24px; color: var(--muted); font-size: 14px; }
    .stage { position: relative; width: 100%; max-width: 440px; aspect-ratio: 1; margin: 0 auto; border-radius: 12px; overflow: hidden; background: var(--surface); touch-action: none; user-select: none; }
    canvas, .tiles { position: absolute; inset: 0; width: 100%; height: 100%; }
    .tiles { pointer-events: none; }
    .tile { position: absolute; top: 0; left: 0; transition: transform 100ms var(--ease-out); }
    .face { width: 100%; height: 100%; display: grid; place-items: center; border-radius: 8px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .spawn .face { animation: arrive 100ms var(--ease-out) both; }
    .merge .face { animation: pop 120ms var(--ease-out) both; }
    @keyframes arrive { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: scale(1); } }
    @keyframes pop { 0%, 100% { transform: scale(1); } 45% { transform: scale(1.08); } }
    .hud { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; max-width: 440px; margin: 24px auto 0; }
    .scores { display: flex; gap: 24px; min-width: 0; }
    .readout { display: grid; gap: 4px; color: var(--muted); font-size: 12px; }
    .readout strong { color: var(--ink); font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
    button { min-height: 44px; padding: 8px 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; font-size: 14px; cursor: pointer; }
    button:hover { border-color: var(--accent); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .overlay { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 16px; padding: 16px; background: var(--bg); text-align: center; }
    .overlay[hidden] { display: none; }
    .overlay p { margin: 0; font-size: 20px; font-variant-numeric: tabular-nums; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    .primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
    @media (prefers-reduced-motion: reduce) {
      .tile { transition: none; }
      .spawn .face, .merge .face { animation: none; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top"><a class="back" href="../../index.html">&#8592; All games</a><h1>2048</h1></header>
    <p class="hint">Arrows / WASD to slide. Swipe on touch.</p>
    <div class="stage" id="stage">
      <canvas id="game" tabindex="0" aria-label="2048 board. Use arrow keys or WASD to slide tiles.">Combine matching tiles to reach 2048.</canvas>
      <div class="tiles" id="tiles" aria-hidden="true"></div>
      <div class="overlay" id="overlay" role="dialog" aria-labelledby="message" hidden>
        <p id="message"></p>
        <div class="actions" id="actions"></div>
      </div>
    </div>
    <div class="hud">
      <div class="scores">
        <span class="readout">Score<strong id="score">0</strong></span>
        <span class="readout">Best<strong id="best">0</strong></span>
      </div>
      <button id="new-game" type="button">New game</button>
      <span class="sr-only" id="announcement" role="status" aria-live="polite"></span>
    </div>
  </main>
  <script>
    (() => {
      'use strict';
      const canvas = document.getElementById('game');
      const context = canvas.getContext('2d');
      const stage = document.getElementById('stage');
      const tiles = document.getElementById('tiles');
      const overlay = document.getElementById('overlay');
      const message = document.getElementById('message');
      const actions = document.getElementById('actions');
      const scoreText = document.getElementById('score');
      const bestText = document.getElementById('best');
      const announcement = document.getElementById('announcement');
      const motion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const theme = window.matchMedia('(prefers-color-scheme: dark)');
      let board;
      let score = 0;
      let best = 0;
      let continued = false;
      let paused = false;
      let turn = null;
      let pending = null;
      let frame = 0;
      let lastTime = 0;
      let width = 440;
      let gap = 8;
      let tileSize = 100;
      let colors;
      let pointer = null;
      try {
        const saved = Number(localStorage.getItem('site.2048.best'));
        if (Number.isSafeInteger(saved) && saved >= 0) best = saved;
      } catch (_) { /* Storage may be disabled or unavailable on file URLs. */ }

      // The board includes its random seed, so moveBoard(board, direction) is pure.
      // Rejection sampling avoids modulo bias, including when choosing an empty cell.
      function randomInt(seed, count) {
        const limit = 4294967295 - (4294967295 % count);
        let sample;
        do {
          seed ^= seed << 13;
          seed ^= seed >>> 17;
          seed ^= seed << 5;
          seed >>>= 0;
          sample = seed - 1;
        } while (sample >= limit);
        return { seed, value: sample % count };
      }

      function spawn(boardState) {
        const empty = [];
        boardState.cells.forEach((value, index) => { if (!value) empty.push(index); });
        if (!empty.length) return { board: boardState, index: -1 };
        const location = randomInt(boardState.seed, empty.length);
        const value = randomInt(location.seed, 10);
        const cells = boardState.cells.slice();
        const index = empty[location.value];
        cells[index] = value.value < 9 ? 2 : 4;
        return { board: { cells, seed: value.seed }, index };
      }

      function moveBoard(boardState, direction) {
        const cells = Array(16).fill(0);
        const moves = [];
        const merged = [];
        let gained = 0;
        for (let line = 0; line < 4; line++) {
          // Read from the destination edge: left/right traverse rows; up/down columns.
          const indices = Array.from({ length: 4 }, (_, offset) => {
            if (direction === 'left') return line * 4 + offset;
            if (direction === 'right') return line * 4 + 3 - offset;
            if (direction === 'up') return offset * 4 + line;
            return (3 - offset) * 4 + line;
          });
          const occupied = indices.filter(index => boardState.cells[index] !== 0);
          let destination = 0;
          for (let source = 0; source < occupied.length; source++) {
            const from = occupied[source];
            const to = indices[destination++];
            const value = boardState.cells[from];
            moves.push({ from, to });
            // Consume both inputs at once: a newly merged result cannot merge again.
            if (source + 1 < occupied.length && value === boardState.cells[occupied[source + 1]]) {
              moves.push({ from: occupied[++source], to });
              cells[to] = value * 2;
              gained += cells[to];
              merged.push(to);
            } else {
              cells[to] = value;
            }
          }
        }
        const changed = cells.some((value, index) => value !== boardState.cells[index]);
        if (!changed) return { board: boardState, changed: false, gained: 0, moves: [], merged: [], spawned: -1 };
        const result = spawn({ cells, seed: boardState.seed });
        return { board: result.board, changed: true, gained, moves, merged, spawned: result.index };
      }

      function hasMoves(cells) {
        return cells.some((value, index) => !value ||
          (index % 4 < 3 && value === cells[index + 1]) ||
          (index < 12 && value === cells[index + 4]));
      }

      function position(element, index) {
        element.style.transform = `translate(${gap + (index % 4) * (tileSize + gap)}px, ${gap + Math.floor(index / 4) * (tileSize + gap)}px)`;
      }

      function render(spawned = -1, merged = []) {
        tiles.replaceChildren();
        board.cells.forEach((value, index) => {
          if (!value) return;
          const tile = document.createElement('div');
          tile.className = 'tile' + (index === spawned ? ' spawn' : merged.includes(index) ? ' merge' : '');
          tile.dataset.cell = index;
          tile.style.width = `${tileSize}px`;
          tile.style.height = `${tileSize}px`;
          position(tile, index);
          const face = document.createElement('div');
          face.className = 'face';
          face.textContent = value;
          const level = Math.min(11, Math.log2(value));
          const inkPercent = Math.min(88, 20 + (level - 1) * 6.8);
          face.style.background = `color-mix(in srgb, ${colors.ink} ${inkPercent}%, ${colors.surface})`;
          face.style.color = inkPercent >= 50 ? colors.surface : colors.ink;
          const digits = String(value).length;
          face.style.fontSize = `${tileSize * (digits >= 4 ? Math.min(.30, .95 / digits) : .38)}px`;
          tile.append(face);
          tiles.append(tile);
        });
        const rows = Array.from({ length: 4 }, (_, row) => board.cells.slice(row * 4, row * 4 + 4).map(value => value || 'empty').join(', '));
        canvas.setAttribute('aria-label', `2048 board. Rows: ${rows.join('; ')}. Use arrow keys or WASD to slide tiles.`);
      }

      function updateScore() {
        scoreText.textContent = score;
        if (score > best) {
          best = score;
          try { localStorage.setItem('site.2048.best', String(best)); } catch (_) { /* The game still works without storage. */ }
        }
        bestText.textContent = best;
      }

      function closeOverlay() {
        overlay.hidden = true;
        canvas.removeAttribute('aria-hidden');
        canvas.tabIndex = 0;
      }

      function showOverlay(text, choices) {
        message.textContent = text;
        actions.replaceChildren();
        choices.forEach(([label, handler], index) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.textContent = label;
          if (index === 0) button.className = 'primary';
          button.addEventListener('click', handler);
          actions.append(button);
        });
        overlay.hidden = false;
        canvas.setAttribute('aria-hidden', 'true');
        canvas.tabIndex = -1;
        actions.firstElementChild.focus({ preventScroll: true });
      }

      function checkEnd() {
        if (!continued && board.cells.some(value => value >= 2048)) {
          showOverlay('You reached 2048.', [
            ['Keep playing', () => { continued = true; closeOverlay(); canvas.focus({ preventScroll: true }); checkEnd(); }],
            ['New game', newGame]
          ]);
        } else if (!hasMoves(board.cells)) {
          showOverlay(`Game over. Score: ${score}`, [['Try again', newGame]]);
        }
      }

      function stopAnimation() {
        cancelAnimationFrame(frame);
        frame = 0;
        turn = null;
        pending = null;
        lastTime = 0;
      }

      function newGame() {
        stopAnimation();
        const seed = (Math.random() * 4294967295 >>> 0) || 1;
        board = spawn(spawn({ cells: Array(16).fill(0), seed }).board).board;
        score = 0;
        continued = false;
        paused = false;
        pointer = null;
        closeOverlay();
        updateScore();
        render();
        announcement.textContent = 'New game. Two tiles on the board.';
        canvas.focus({ preventScroll: true });
      }

      function requestMove(direction) {
        if (paused || !overlay.hidden) return;
        if (turn) { pending = direction; return; }
        const result = moveBoard(board, direction);
        if (!result.changed) return;
        board = result.board;
        score += result.gained;
        updateScore();
        announcement.textContent = `Score ${score}.`;
        if (motion.matches) { render(); checkEnd(); return; }
        const elements = new Map(Array.from(tiles.children, tile => [Number(tile.dataset.cell), tile]));
        result.moves.forEach(({ from, to }) => position(elements.get(from), to));
        turn = { result, elapsed: 0, settled: false };
        lastTime = performance.now();
        frame = requestAnimationFrame(tick);
      }

      function tick(time) {
        if (!turn || paused) return;
        const delta = Math.min(Math.max((time - lastTime) / 1000, 0), 1 / 30);
        lastTime = time;
        turn.elapsed += delta;
        if (!turn.settled && turn.elapsed >= .1) {
          render(turn.result.spawned, turn.result.merged);
          turn.settled = true;
        }
        if (turn.elapsed >= .22) {
          turn = null;
          frame = 0;
          checkEnd();
          const next = pending;
          pending = null;
          if (next) requestMove(next);
        } else {
          frame = requestAnimationFrame(tick);
        }
      }

      function pause() {
        pointer = null;
        if (paused || !overlay.hidden) return;
        paused = true;
        stopAnimation();
        render();
        showOverlay('Paused', [['Resume', () => {
          paused = false;
          closeOverlay();
          canvas.focus({ preventScroll: true });
          checkEnd();
        }]]);
      }

      function resize() {
        const style = getComputedStyle(document.documentElement);
        colors = { ink: style.getPropertyValue('--ink').trim(), surface: style.getPropertyValue('--surface').trim(), line: style.getPropertyValue('--line').trim() };
        width = stage.getBoundingClientRect().width;
        gap = 8 * width / 440;
        tileSize = (width - gap * 2 - gap * 3) / 4;
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(width * ratio);
        canvas.height = Math.round(width * ratio);
        context.setTransform(canvas.width / width, 0, 0, canvas.height / width, 0, 0);
        context.clearRect(0, 0, width, width);
        context.fillStyle = colors.line;
        for (let index = 0; index < 16; index++) {
          const x = gap + (index % 4) * (tileSize + gap);
          const y = gap + Math.floor(index / 4) * (tileSize + gap);
          context.beginPath();
          context.roundRect(x, y, tileSize, tileSize, 8 * width / 440);
          context.fill();
        }
        if (board) {
          const wasMoving = Boolean(turn);
          stopAnimation();
          render();
          if (wasMoving && !paused) checkEnd();
        }
      }

      const directions = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', a: 'left', d: 'right', w: 'up', s: 'down' };
      document.addEventListener('keydown', event => {
        if (event.ctrlKey || event.metaKey || event.altKey) return;
        const direction = directions[event.key] || directions[event.key.toLowerCase()];
        if (!direction) return;
        event.preventDefault();
        requestMove(direction);
      });
      stage.addEventListener('pointerdown', event => {
        if (!event.isPrimary || event.button !== 0 || !overlay.hidden || paused) return;
        pointer = { id: event.pointerId, x: event.clientX, y: event.clientY };
        stage.setPointerCapture(event.pointerId);
        canvas.focus({ preventScroll: true });
      });
      stage.addEventListener('pointerup', event => {
        if (!pointer || pointer.id !== event.pointerId) return;
        const dx = event.clientX - pointer.x;
        const dy = event.clientY - pointer.y;
        pointer = null;
        const horizontal = Math.abs(dx);
        const vertical = Math.abs(dy);
        if (Math.max(horizontal, vertical) < 24 || Math.max(horizontal, vertical) < Math.min(horizontal, vertical) * 1.25) return;
        event.preventDefault();
        requestMove(horizontal > vertical ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
      });
      stage.addEventListener('pointercancel', () => { pointer = null; });
      stage.addEventListener('lostpointercapture', () => { pointer = null; });
      document.getElementById('new-game').addEventListener('click', newGame);
      document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
      window.addEventListener('blur', pause);
      window.addEventListener('resize', resize);
      new ResizeObserver(resize).observe(stage);
      theme.addEventListener('change', resize);
      motion.addEventListener('change', () => {
        if (turn) { stopAnimation(); render(); checkEnd(); }
      });
      resize();
      newGame();
    })();
  </script>
</body>
</html>
