<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Play Breakout with your keyboard, mouse, or touch. Clear the bricks, keep the ball alive, and beat your high score.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%2316181D'/><text x='32' y='44' font-family='Georgia,serif' font-size='36' fill='%23FCFBF8' text-anchor='middle'>D</text></svg>">
  <title>Breakout &middot; David Clough</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #FCFBF8;
      --surface: #FFFFFF;
      --ink: #16181D;
      --muted: #6B7280;
      --line: rgba(22,24,29,0.10);
      --accent: #B4451F;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14161A;
        --surface: #1C1F24;
        --ink: #EDEDEF;
        --muted: #9AA1AC;
        --line: rgba(237,237,239,0.14);
        --accent: #E07A4F;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    .wrap { max-width: 820px; margin: 0 auto; padding: 24px; }
    .top { display: flex; flex-direction: column; align-items: flex-start; gap: 24px; }
    .back { color: var(--muted); text-decoration: none; }
    .back:hover { color: var(--accent); }
    h1 { margin: 0; font: 400 40px/1.1 Georgia, 'Iowan Old Style', 'Times New Roman', serif; }
    .hint { margin: 12px 0 24px; color: var(--muted); font-size: 14px; }
    .stage { overflow: hidden; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
    canvas { display: block; width: 100%; max-width: 100%; aspect-ratio: 4 / 3; margin: auto; touch-action: none; }
    canvas:focus-visible { outline-offset: -4px; }
    .hud { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; margin-top: 16px; }
    .stats { display: flex; gap: 24px; }
    .stat { color: var(--muted); font-size: 12px; }
    .stat output { display: block; color: var(--ink); font-size: 20px; font-variant-numeric: tabular-nums; }
    .actions { display: flex; gap: 8px; }
    button {
      min-height: 44px;
      padding: 8px 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      font: inherit;
      cursor: pointer;
    }
    button:hover:not(:disabled) { border-color: var(--accent); }
    button:disabled { color: var(--muted); cursor: default; opacity: 0.6; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (max-width: 480px) {
      .stats { width: 100%; justify-content: space-between; gap: 12px; }
      .actions { width: 100%; }
      button { flex: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top"><a class="back" href="../../index.html">&#8592; All games</a><h1>Breakout</h1></header>
    <p class="hint">Move: pointer or ← → / A D. Play: Space, Enter or tap. Pause: Space.</p>
    <div class="stage"><canvas id="game" tabindex="0" aria-label="Breakout playfield. Move with arrow keys, A and D, or a pointer. Press Space or Enter to launch, Space to pause.">Breakout requires a browser with canvas support.</canvas></div>
    <div class="hud">
      <div class="stats" aria-label="Game statistics">
        <div class="stat">Score<output id="score">0</output></div>
        <div class="stat">High<output id="best">0</output></div>
        <div class="stat">Lives<output id="lives">3</output></div>
        <div class="stat">Level<output id="level">1</output></div>
      </div>
      <div class="actions"><button id="pause" type="button" disabled>Pause</button><button id="restart" type="button">New game</button></div>
    </div>
  </main>
  <script>
    (() => {
      'use strict';
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const pauseButton = document.getElementById('pause');
      const restartButton = document.getElementById('restart');
      const outputs = Object.fromEntries(['score', 'best', 'lives', 'level'].map(id => [id, document.getElementById(id)]));
      const W = 800, H = 600, R = 8;
      const PADDLE_W = 120, PADDLE_H = 14, PADDLE_Y = H - 48 - PADDLE_H;
      const COLS = 8, ROWS = 5, GAP = 1, MARGIN = 12, TOP = 56, BRICK_H = 24;
      const BRICK_W = (W - MARGIN * 2 - GAP * (COLS - 1)) / COLS;
      const EPSILON = 0.000001;
      const keys = new Set();
      const theme = window.matchMedia('(prefers-color-scheme: dark)');
      let colors, state = 'waiting', score = 0, best = 0, lives = 3, level = 1;
      let bricks = [], remaining = 0, destroyed = 0;
      let paddleX = W / 2, targetX = W / 2, pointerMode = false;
      let ball = { x: W / 2, y: PADDLE_Y - R, vx: 0, vy: 0 };
      let lastTime = 0, request = 0, pointerId = null;
      try {
        const saved = Number(localStorage.getItem('site.breakout.best'));
        if (Number.isSafeInteger(saved) && saved >= 0) best = saved;
      } catch (_) { /* Storage may be unavailable on file URLs or in private mode. */ }

      const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
      const speed = () => Math.min(620, 340 * Math.pow(1.08, level - 1) * Math.pow(1.03, destroyed));

      function updateHud() {
        outputs.score.value = String(score);
        outputs.best.value = String(best);
        outputs.lives.value = String(lives);
        outputs.level.value = String(level);
        pauseButton.textContent = state === 'paused' ? 'Resume' : 'Pause';
        pauseButton.disabled = state !== 'playing' && state !== 'paused';
      }

      function setState(next) {
        state = next;
        lastTime = 0;
        updateHud();
        schedule();
      }

      function buildBricks() {
        bricks = [];
        destroyed = 0;
        for (let row = 0; row < ROWS; row++) {
          for (let col = 0; col < COLS; col++) {
            const hits = row < 2 ? 2 : 1;
            bricks.push({ x: MARGIN + col * (BRICK_W + GAP), y: TOP + row * (BRICK_H + GAP), hits, maxHits: hits });
          }
        }
        remaining = bricks.length;
      }

      function dockBall() {
        ball.x = paddleX;
        ball.y = PADDLE_Y - R - 0.02;
        ball.vx = 0;
        ball.vy = 0;
      }

      function newGame() {
        score = 0;
        lives = 3;
        level = 1;
        paddleX = targetX = W / 2;
        keys.clear();
        pointerMode = false;
        buildBricks();
        dockBall();
        setState('waiting');
      }

      function launch() {
        if (document.hidden) return;
        if (state === 'gameover') newGame();
        if (state !== 'waiting') return;
        const angle = (Math.random() * 70 - 35) * Math.PI / 180;
        ball.vx = Math.sin(angle) * speed();
        ball.vy = -Math.cos(angle) * speed();
        setState('playing');
      }

      function togglePause() {
        if (state === 'playing') {
          keys.clear();
          setState('paused');
        } else if (state === 'paused' && !document.hidden) {
          setState('playing');
        }
      }

      function suspend() {
        keys.clear();
        pointerId = null;
        if (state === 'playing') setState('paused');
      }

      function loseLife() {
        lives--;
        dockBall();
        setState(lives > 0 ? 'waiting' : 'gameover');
      }

      function nextLevel() {
        level++;
        buildBricks();
        dockBall();
        setState('waiting');
      }

      function damageBrick(brick) {
        brick.hits--;
        if (brick.hits > 0) return;
        remaining--;
        destroyed++;
        score += brick.maxHits * 10;
        if (score > best) {
          best = score;
          try { localStorage.setItem('site.breakout.best', String(best)); } catch (_) { /* Play without persistence. */ }
        }
        updateHud();
      }

      function normalizeVelocity() {
        const angle = Math.atan2(Math.abs(ball.vx), Math.abs(ball.vy));
        const safeAngle = Math.min(angle, Math.PI / 3);
        const magnitude = speed();
        ball.vx = Math.sign(ball.vx) * Math.sin(safeAngle) * magnitude;
        ball.vy = (ball.vy < 0 ? -1 : 1) * Math.cos(safeAngle) * magnitude;
      }

      // Swept point against a radius-expanded brick. A slab entry prevents tunneling.
      function brickImpact(brick, duration) {
        const left = brick.x - R, right = brick.x + BRICK_W + R;
        const top = brick.y - R, bottom = brick.y + BRICK_H + R;
        let nearX = -Infinity, farX = Infinity, nearY = -Infinity, farY = Infinity;
        if (Math.abs(ball.vx) < EPSILON) {
          if (ball.x <= left || ball.x >= right) return null;
        } else {
          const a = (left - ball.x) / ball.vx, b = (right - ball.x) / ball.vx;
          nearX = Math.min(a, b);
          farX = Math.max(a, b);
        }
        if (Math.abs(ball.vy) < EPSILON) {
          if (ball.y <= top || ball.y >= bottom) return null;
        } else {
          const a = (top - ball.y) / ball.vy, b = (bottom - ball.y) / ball.vy;
          nearY = Math.min(a, b);
          farY = Math.max(a, b);
        }
        const enter = Math.max(nearX, nearY), exit = Math.min(farX, farY);
        if (enter < -EPSILON || enter > exit || enter > duration || exit < 0) return null;
        return {
          time: Math.max(0, enter),
          nx: nearX >= nearY - EPSILON ? -Math.sign(ball.vx) : 0,
          ny: nearY >= nearX - EPSILON ? -Math.sign(ball.vy) : 0,
          brick
        };
      }

      function moveBall(duration) {
        // Resolve earliest impacts, including simultaneous neighboring bricks, before advancing.
        for (let iteration = 0; duration > EPSILON && iteration < 12; iteration++) {
          let soonest = duration + 1;
          let hits = [];
          const offer = hit => {
            if (!hit || hit.time < -EPSILON || hit.time > duration) return;
            hit.time = Math.max(0, hit.time);
            if (hit.time < soonest - EPSILON) { soonest = hit.time; hits = [hit]; }
            else if (Math.abs(hit.time - soonest) <= EPSILON) hits.push(hit);
          };
          if (ball.vx < 0) offer({ time: (R - ball.x) / ball.vx, nx: 1, ny: 0 });
          if (ball.vx > 0) offer({ time: (W - R - ball.x) / ball.vx, nx: -1, ny: 0 });
          if (ball.vy < 0) offer({ time: (R - ball.y) / ball.vy, nx: 0, ny: 1 });
          if (ball.vy > 0) {
            const time = (PADDLE_Y - R - ball.y) / ball.vy;
            const x = ball.x + ball.vx * time;
            if (time >= -EPSILON && x >= paddleX - PADDLE_W / 2 - R && x <= paddleX + PADDLE_W / 2 + R) {
              offer({ time, nx: 0, ny: -1, paddle: true });
            }
            offer({ time: (H + R - ball.y) / ball.vy, nx: 0, ny: 0, lost: true });
          }
          for (const brick of bricks) if (brick.hits > 0) offer(brickImpact(brick, duration));
          if (!hits.length) {
            ball.x += ball.vx * duration;
            ball.y += ball.vy * duration;
            break;
          }
          ball.x += ball.vx * soonest;
          ball.y += ball.vy * soonest;
          duration -= soonest;
          if (hits.some(hit => hit.lost)) { loseLife(); return; }
          let nx = 0, ny = 0;
          for (const hit of hits) {
            if (hit.brick) damageBrick(hit.brick);
            if (hit.nx) nx = hit.nx;
            if (hit.ny) ny = hit.ny;
          }
          if (remaining === 0) { nextLevel(); return; }
          if (hits.some(hit => hit.paddle)) {
            const offset = clamp((ball.x - paddleX) / (PADDLE_W / 2), -1, 1);
            // A dead-centre hit would otherwise leave vx at exactly 0 and the ball
            // travelling straight up and down forever; keep a slight steer.
            const steer = Math.abs(offset) < 0.05 ? (ball.vx < 0 ? -0.05 : 0.05) : offset;
            const angle = steer * Math.PI / 3;
            ball.vx = Math.sin(angle) * speed();
            ball.vy = -Math.cos(angle) * speed();
          } else {
            if (nx) ball.vx = -ball.vx;
            if (ny) ball.vy = -ball.vy;
          }
          normalizeVelocity();
          // Separate from contact planes so the next sweep cannot count the same impact twice.
          ball.x += nx * 0.02;
          ball.y += ny * 0.02;
        }
      }

      function update(dt) {
        const direction = Number(keys.has('ArrowRight') || keys.has('d')) - Number(keys.has('ArrowLeft') || keys.has('a'));
        if (direction) {
          paddleX += direction * 520 * dt;
          targetX = paddleX;
        } else if (pointerMode) {
          paddleX += (targetX - paddleX) * (1 - Math.exp(-20 * dt));
          if (Math.abs(targetX - paddleX) < 0.05) paddleX = targetX;
        }
        paddleX = clamp(paddleX, PADDLE_W / 2, W - PADDLE_W / 2);
        targetX = clamp(targetX, PADDLE_W / 2, W - PADDLE_W / 2);
        if (state === 'waiting') dockBall();
        else if (state === 'playing') moveBall(dt);
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);
        for (const brick of bricks) {
          if (!brick.hits) continue;
          ctx.fillStyle = colors.accent;
          ctx.globalAlpha = brick.maxHits === 2 ? (brick.hits === 2 ? 1 : 0.66) : 0.46;
          ctx.fillRect(brick.x, brick.y, BRICK_W, BRICK_H);
        }
        ctx.globalAlpha = 1;
        ctx.fillStyle = colors.ink;
        ctx.beginPath();
        ctx.roundRect(paddleX - PADDLE_W / 2, PADDLE_Y, PADDLE_W, PADDLE_H, 7);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, R, 0, Math.PI * 2);
        ctx.fill();
        if (state !== 'playing') {
          const message = state === 'paused' ? 'Paused · press Space to resume' : state === 'gameover' ? 'Game over — press Space' : 'Press Space to play';
          ctx.fillStyle = colors.surface;
          ctx.strokeStyle = colors.line;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.roundRect(148, 266, 504, 76, 12);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = colors.ink;
          ctx.font = '24px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(message, W / 2, 304, 464);
        }
      }

      function schedule() {
        if (!request) request = requestAnimationFrame(frame);
      }

      function frame(time) {
        request = 0;
        const dt = lastTime ? Math.min((time - lastTime) / 1000, 1 / 30) : 0;
        lastTime = time;
        if (state === 'playing' || state === 'waiting') update(dt);
        draw();
        if (state === 'playing' || (state === 'waiting' && (keys.size || Math.abs(targetX - paddleX) > 0.05))) schedule();
      }

      function resize() {
        const rect = canvas.getBoundingClientRect();
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(rect.width * ratio);
        canvas.height = Math.round(rect.height * ratio);
        ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
        const style = getComputedStyle(document.documentElement);
        colors = Object.fromEntries(['surface', 'ink', 'line', 'accent'].map(name => [name, style.getPropertyValue('--' + name).trim()]));
        schedule();
      }

      function point(event) {
        const rect = canvas.getBoundingClientRect();
        targetX = clamp((event.clientX - rect.left) / rect.width * W, PADDLE_W / 2, W - PADDLE_W / 2);
        pointerMode = true;
        keys.clear();
        schedule();
      }

      canvas.addEventListener('pointerdown', event => {
        if (pointerId !== null || !event.isPrimary) return;
        pointerId = event.pointerId;
        canvas.focus({ preventScroll: true });
        canvas.setPointerCapture(event.pointerId);
        point(event);
      });
      canvas.addEventListener('pointermove', event => {
        if (event.pointerType === 'mouse' || event.pointerId === pointerId) point(event);
      });
      canvas.addEventListener('pointerup', event => {
        if (event.pointerId !== pointerId) return;
        pointerId = null;
        if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
        if (state === 'waiting' || state === 'gameover') launch();
      });
      canvas.addEventListener('pointercancel', () => { pointerId = null; });
      window.addEventListener('keydown', event => {
        if (event.target !== canvas && event.target !== document.body) return;
        const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
        if (!['ArrowLeft', 'ArrowRight', 'a', 'd', ' ', 'Enter'].includes(key)) return;
        event.preventDefault();
        canvas.focus({ preventScroll: true });
        if (key === ' ' || key === 'Enter') {
          if (event.repeat) return;
          if (state === 'waiting' || state === 'gameover') launch();
          else if (key === ' ') togglePause();
        } else {
          pointerMode = false;
          targetX = paddleX;
          keys.add(key);
          schedule();
        }
      });
      window.addEventListener('keyup', event => {
        keys.delete(event.key.length === 1 ? event.key.toLowerCase() : event.key);
      });
      pauseButton.addEventListener('click', togglePause);
      restartButton.addEventListener('click', () => { newGame(); canvas.focus({ preventScroll: true }); });
      document.addEventListener('visibilitychange', () => { if (document.hidden) suspend(); });
      window.addEventListener('blur', suspend);
      canvas.addEventListener('blur', () => { keys.clear(); });
      window.addEventListener('resize', resize);
      theme.addEventListener('change', resize);
      new ResizeObserver(resize).observe(canvas);
      resize();
      newGame();
    })();
  </script>
</body>
</html>
